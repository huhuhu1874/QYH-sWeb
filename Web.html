<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <meta name="description" content="个人主页，项目与随笔">
  <!-- Tailwind CDN，不需要本地安装 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#222222',
            muted: '#666666',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .link-hover {
        @apply transition-colors duration-200 hover:text-black;
      }
      .card-hover {
        @apply transition-all duration-200 hover:shadow-md hover:-translate-y-0.5;
      }
    }
  </style>
</head>
<body class="bg-white text-primary antialiased min-h-screen flex flex-col">
  <!-- 导航栏【扩展点：新增页面只需要加导航项 + 新建html】 -->
  <header class="w-full max-w-3xl mx-auto px-6 py-8">
    <nav class="flex justify-between items-center">
      <a href="./index.html" class="text-lg font-bold">你的名字</a>
      <div class="space-x-6 text-sm text-muted">
        <a href="./index.html" class="link-hover">首页</a>
        <a href="./projects.html" class="link-hover">项目</a>
        <a href="./blog.html" class="link-hover">随笔</a>
        <a href="./about.html" class="link-hover">关于</a>
      </div>
    </nav>
  </header>

  <main class="flex-grow w-full max-w-3xl mx-auto px-6">
    <!-- Hero 个人介绍区 -->
    <section class="py-12 border-b border-gray-100">
      <div class="flex flex-col md:flex-row gap-8 items-start">
        <div class="w-24 h-24 rounded-full bg-gray-100 shrink-0 overflow-hidden">
          <!-- 替换成你的头像 -->
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="avatar" class="w-full h-full object-cover">
        </div>
        <div>
          <h1 class="text-2xl font-bold mb-3">Hi，我是 XXX</h1>
          <p class="text-muted leading-relaxed mb-4">
            一句话介绍自己。喜欢做有意思的小东西，记录学习和想法。
          </p>
          <div class="flex gap-4 text-sm">
            <a href="https://github.com/" target="_blank" class="link-hover">GitHub</a>
            <a href="mailto:xxx@example.com" class="link-hover">Email</a>
            <a href="#" class="link-hover">RSS</a>
          </div>
        </div>
      </div>
    </section>

    <!-- 项目区域【重点：数据驱动渲染，后续改成读取json文件】 -->
    <section class="py-12 border-b border-gray-100">
      <h2 class="text-xl font-semibold mb-6">项目</h2>
      <div id="project-list" class="grid gap-4">
        <!-- JS自动渲染项目卡片，不用手写DOM -->
      </div>
    </section>

    <!-- 随笔/博客区域【扩展为博客列表页】 -->
    <section class="py-12">
      <h2 class="text-xl font-semibold mb-6">最近随笔</h2>
      <div id="post-list" class="grid gap-4">
        <!-- JS自动渲染文章卡片 -->
      </div>
    </section>
  </main>

  <!-- 页脚【组件，后面可以抽离复用】 -->
  <footer class="w-full max-w-3xl mx-auto px-6 py-10 text-sm text-muted">
    <p>© 2026 你的名字. Powered by simple static site.</p>
  </footer>

  <script>
    // ====================== 数据层【重点！扩展只改这里，不动页面结构】 ======================
    // ✅ 以后可以把这部分抽离成 data/projects.json，用fetch加载
    const projects = [
      {
        title: "简易工具",
        desc: "一个轻量小工具，用来处理日常琐碎需求。",
        link: "#",
        tags: ["JS", "工具"]
      },
      {
        title: "示例项目",
        desc: "演示用项目，可替换成你自己的作品。",
        link: "#",
        tags: ["HTML", "CSS"]
      }
    ]

    const posts = [
      {
        title: "搭建个人网站的思路",
        date: "2026-10-01",
        link: "#",
        desc: "记录如何做一个简单但方便扩展的站点。"
      }
    ]

    // ====================== 渲染函数【视图层，和数据解耦】 ======================
    function renderProjects() {
      const container = document.getElementById('project-list')
      container.innerHTML = projects.map(item => `
        <a href="${item.link}" class="block p-4 rounded-lg bg-gray-50 card-hover">
          <h3 class="font-medium">${item.title}</h3>
          <p class="text-muted text-sm mt-1">${item.desc}</p>
          <div class="flex gap-2 mt-2">
            ${item.tags.map(tag => `<span class="text-xs px-2 py-0.5 bg-gray-200 rounded">${tag}</span>`).join('')}
          </div>
        </a>
      `).join('')
    }

    function renderPosts() {
      const container = document.getElementById('post-list')
      container.innerHTML = posts.map(item => `
        <a href="${item.link}" class="block card-hover">
          <div class="flex justify-between">
            <h3 class="font-medium">${item.title}</h3>
            <span class="text-muted text-sm">${item.date}</span>
          </div>
          <p class="text-muted text-sm mt-1">${item.desc}</p>
        </a>
      `).join('')
    }

    // 初始化渲染
    renderProjects()
    renderPosts()

    // ====================== 预留扩展函数【直接在这里加功能】 ======================
    // 暗黑模式开关（直接补全逻辑即可启用）
    function toggleDark() {
      document.documentElement.classList.toggle('dark')
    }

    // 搜索功能入口
    function openSearch() {
      console.log('搜索弹窗触发')
    }
  </script>
</body>
</html>
